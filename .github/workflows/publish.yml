name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.0.21"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Configure it as a GitHub Actions secret, not a repository variable."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up JDK, Maven settings and GPG
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::Release version is empty."
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Release version must not end with -SNAPSHOT."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Show effective version
        run: mvn -B -ntp -q -Drevision=${{ steps.release.outputs.version }} help:evaluate -Dexpression=project.version -DforceStdout

      - name: Publish to Maven Central
        run: >
          mvn -B -ntp -DskipTests
          -P release
          -Drevision=${{ steps.release.outputs.version }}
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=published
          -Dgpg.passphrase="${GPG_PASSPHRASE}"
          clean
          deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
