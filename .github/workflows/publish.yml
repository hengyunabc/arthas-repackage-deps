name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.0.21'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Validate release secrets
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Configure it as a GitHub Actions secret, not a repository variable."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import GPG private key
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          if grep -q "BEGIN PGP PRIVATE KEY BLOCK" <<< "$MAVEN_GPG_PRIVATE_KEY"; then
            printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi
          gpg --batch --list-secret-keys --keyid-format LONG

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        run: >
          mvn -B -ntp -DskipTests
          -P release
          -Drevision=${{ steps.release.outputs.version }}
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=published
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
